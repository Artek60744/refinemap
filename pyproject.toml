[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refinemap"
version = "0.1.0"
description = "Transforme une idée floue en décision argumentée et en spec markdown, en local."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Charles Andrade" }]
keywords = ["refinement", "spec", "llm", "agent", "product", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]

# The CLI drives the same engine as the web app, so it needs the engine's
# dependencies. Kept in sync with requirements.txt; the web-only extras
# (uvicorn, python-multipart, psycopg2) live in the "server" extra so a
# `pipx install refinemap` stays light.
dependencies = [
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.32",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "langgraph>=0.2.34",
  "cryptography>=43.0.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.13.2",
]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
refinemap = "src.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Prompts live at the repo root but must ship inside the package: once installed,
# there is no repo root to resolve them from (see Settings.prompts_dir).
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "src/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite marks its async tests explicitly with @pytest.mark.asyncio.
asyncio_mode = "strict"
