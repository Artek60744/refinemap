name: OpenWiki docs update

on:
  push:
    branches: [dev]
    paths-ignore:
      - "openwiki/**"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: openwiki-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install OpenWiki CLI
        run: npm ci

      - name: Update OpenWiki docs
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: https://api.deepseek.com/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENWIKI_MODEL_ID: deepseek-v4-flash
          OPENWIKI_TELEMETRY_DISABLED: "1"
        run: npm run docs:update

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openwiki/ AGENTS.md CLAUDE.md
          if git diff --cached --quiet; then
            echo "No docs changes to commit."
          else
            git commit -m "docs: refresh OpenWiki pages [skip ci]"
            git push
          fi
